version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dorisio-postgres
    environment:
      POSTGRES_USER: dorisio
      POSTGRES_PASSWORD: dorisio_dev_password
      POSTGRES_DB: dorisio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dorisio']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dorisio-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dorisio-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://dorisio:dorisio_dev_password@postgres:5432/dorisio
      REDIS_URL: redis://redis:6379
      PORT: 3000
      LOG_LEVEL: debug
      JWT_SECRET: dev-secret-key-change-in-production
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_SERVER_SECRET_KEY: ${STELLAR_SERVER_SECRET_KEY}
      USDC_CONTRACT_ID: ${USDC_CONTRACT_ID}
      USDC_ISSUER: ${USDC_ISSUER}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: pnpm dev
    networks:
      - dorisio-network

volumes:
  postgres_data:
  redis_data:

networks:
  dorisio-network:
    driver: bridge
