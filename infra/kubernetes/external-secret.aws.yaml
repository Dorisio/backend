apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dorisio-backend-secrets
  namespace: dorisio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dorisio-aws-secrets
  target:
    name: dorisio-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: dorisio/production/backend
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: dorisio/production/backend
        property: REDIS_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: dorisio/production/backend
        property: JWT_SECRET
    - secretKey: STELLAR_SERVER_SECRET_KEY
      remoteRef:
        key: dorisio/production/backend
        property: STELLAR_SERVER_SECRET_KEY
        optional: true
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: dorisio/production/backend
        property: STRIPE_SECRET_KEY
        optional: true
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: dorisio/production/backend
        property: STRIPE_WEBHOOK_SECRET
        optional: true
