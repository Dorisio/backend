global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: pagerduty
      continue: true

receivers:
  - name: slack
    slack_configs:
      - api_url: "$ALERTMANAGER_SLACK_WEBHOOK_URL"
        channel: "#dorisio-alerts"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

  - name: pagerduty
    pagerduty_configs:
      - routing_key: "$PAGERDUTY_ROUTING_KEY"
        send_resolved: true
